[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pool-aim"
version = "1.1.0"
description = "A passive on-screen aiming overlay for pool/billiards games (PyQt5)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sushang Agnihotri" }]
dependencies = ["PyQt5>=5.15.9,<6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7"]
assets = ["Pillow>=10"]

[project.scripts]
pool-aim = "pool_aim.app:main"

[project.urls]
Homepage = "https://github.com/Sushang-Agnihotri/8-Ball-Pool-Aim-tool"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
